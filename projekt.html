    <nav>
        <input type="checkbox" id="log">
        <label for="log" class="log-btn">Logowanie</label>
        <div class="logowanie">
            <div class="container">
                <label class="close-btn" for="log"></label>
    
                <!-- Zakładki -->
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchTab('login', this)">Logowanie</button>
                    <button class="tab-btn"        onclick="switchTab('register', this)">Rejestracja</button>
                </div>
    
                <!-- Formularz logowania -->
                <form class="auth-form active" id="form-login">
                    <div class="field">
                        <label>Email</label>
                        <input type="email" placeholder="twoj@email.com" required>
                    </div>
                    <div class="field">
                        <label>Hasło</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Zaloguj się</button>
                    <div class="switch-link">
                        Nie masz konta? <span onclick="switchTab('register', null)">Zarejestruj się</span>
                    </div>
                </form>
    
                <!-- Formularz rejestracji -->
                <form class="auth-form" id="form-register">
                    <div class="field">
                        <label>Imię</label>
                        <input type="text" placeholder="Jan Kowalski" required>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" placeholder="twoj@email.com" required>
                    </div>
                    <div class="field">
                        <label>Hasło</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <div class="field">
                        <label>Powtórz hasło</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Zarejestruj się</button>
                    <div class="switch-link">
                        Masz już konto? <span onclick="switchTab('login', null)">Zaloguj się</span>
                    </div>
                </form>
            </div>
        </div>
    </nav>
